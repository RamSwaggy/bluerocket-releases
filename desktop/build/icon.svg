<!--
  Rocket Rumble app logo (512 x 512).
  A side-on rocket car blasting right, booster flame trailing behind it,
  on the hub's night-navy background. The colours match games/index.html:
  navy #070b1a, accent yellow #ffcc33, hot orange #ff5a3c.
  Kept bold and simple so it still reads as a "car with a flame" at 16 px.
  build-icon.py renders this to icon.png and icon.ico.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: navy with a warm glow behind the car -->
    <radialGradient id="bg" cx="58%" cy="52%" r="70%">
      <stop offset="0" stop-color="#1c2a5c"/>
      <stop offset="1" stop-color="#070b1a"/>
    </radialGradient>
    <!-- Booster flame: white-hot at the nozzle, fading to orange -->
    <linearGradient id="flame" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.35" stop-color="#ffcc33"/>
      <stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/>
    </linearGradient>
    <!-- Car body: yellow top shading down to orange -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#ff7a2e"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#ffcc33" stroke-opacity="0.35" stroke-width="10"/>

  <!-- Speed lines behind the car -->
  <g stroke="#7fa4ff" stroke-linecap="round" stroke-opacity="0.55" stroke-width="14">
    <line x1="70" y1="190" x2="170" y2="190"/>
    <line x1="56" y1="350" x2="150" y2="350"/>
  </g>

  <!-- Booster flame (drawn before the car so the car sits on top) -->
  <path d="M190 262 C150 238 100 244 52 270 C100 292 150 300 190 284 Z" fill="url(#flame)"/>

  <!-- Car body: a low wedge, nose pointing right -->
  <path d="M170 300 L178 240 C182 222 196 212 214 210 L300 206 C318 205 332 212 346 224
           L410 262 C430 274 440 290 440 306 L440 318 L170 318 Z"
        fill="url(#body)" stroke="#070b1a" stroke-width="10" stroke-linejoin="round"/>
  <!-- Windscreen -->
  <path d="M232 222 L298 219 C310 219 320 224 330 232 L362 258 L226 262 Z"
        fill="#0d1838" stroke="#070b1a" stroke-width="6" stroke-linejoin="round"/>
  <!-- Booster nozzle at the back -->
  <rect x="160" y="250" width="34" height="44" rx="8" fill="#3a4466" stroke="#070b1a" stroke-width="8"/>

  <!-- Wheels -->
  <g stroke="#070b1a" stroke-width="10">
    <circle cx="232" cy="322" r="40" fill="#1a1f33"/>
    <circle cx="380" cy="322" r="40" fill="#1a1f33"/>
  </g>
  <circle cx="232" cy="322" r="15" fill="#ffcc33"/>
  <circle cx="380" cy="322" r="15" fill="#ffcc33"/>
</svg>
