<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Turbo Party · Rocket Rumble</title>
  <style>
    /* ------------------------------------------------------------------
       Colour tokens. Everything on screen pulls from these so the look
       stays consistent and is easy to re-skin later.
       ------------------------------------------------------------------ */
    :root {
      --bg: #0b1020;
      --panel: rgba(12, 18, 40, 0.86);
      --panel-solid: #121a36;
      --line: rgba(255, 255, 255, 0.14);
      --text: #f2f5ff;
      --muted: #9aa6c8;
      --accent: #ffcc33;
      --good: #34d399;
      --bad: #f87171;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    /* The WebGL canvas fills the window; all UI floats above it. */
    #game { position: fixed; inset: 0; display: block; }
    .layer { position: fixed; pointer-events: none; }

    /* ---------- Board HUD: one panel per player along the top ---------- */
    #hud-players {
      top: 12px; left: 12px; right: 12px;
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    }
    .pcard {
      position: relative;
      min-width: 150px; padding: 8px 12px; border-radius: 12px;
      background: var(--panel); border: 2px solid var(--line);
      display: flex; flex-direction: column; gap: 4px;
      transition: transform .2s, border-color .2s, opacity .2s, box-shadow .2s;
    }
    .pcard .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .pcard .name { font-weight: 700; font-size: 15px; }
    /* Small controller pill (CPU / KEYS 1 / PAD 2) instead of a whole line. */
    .pcard .tag {
      font-size: 10px; font-weight: 800; letter-spacing: .06em; color: var(--muted);
      padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line);
    }
    .pcard .stats { font-size: 15px; display: flex; gap: 12px; }

    /* Whose turn: the card lifts, glows in the player's colour (--pc), gets a
       tinted background and a "TURN" tab underneath. Everyone else dims. */
    .pcard.active {
      transform: translateY(4px) scale(1.07);
      border-color: var(--pc);
      background: linear-gradient(color-mix(in srgb, var(--pc) 28%, transparent), transparent), var(--panel-solid);
      box-shadow: 0 0 0 2px var(--pc), 0 0 22px var(--pc);
    }
    /* Dim the idle cards' contents, but not the leader's crown badge. */
    .pcard.idle > :not(.crown) { opacity: .6; }
    .pcard.idle { border-color: rgba(255,255,255,.08); }
    .pcard .turn-tab {
      position: absolute; left: 50%; bottom: -13px; transform: translateX(-50%);
      padding: 1px 10px; border-radius: 999px; background: var(--pc); color: #0b1020;
      font-size: 11px; font-weight: 900; letter-spacing: .1em; white-space: nowrap;
    }
    /* Leader badge, pinned to the card's top-left corner. */
    .pcard .crown {
      position: absolute; top: -11px; left: -8px;
      padding: 1px 8px; border-radius: 999px; background: var(--accent); color: #1a1300;
      font-size: 12px; font-weight: 900; box-shadow: 0 2px 6px rgba(0,0,0,.4);
    }

    /* ---------- Turn counter, under the player cards ---------- */
    #turn-label {
      top: 104px; left: 50%; transform: translateX(-50%);
      padding: 3px 12px; border-radius: 999px; background: var(--panel);
      font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: .08em;
    }
    #turn-label:empty { display: none; }

    /* ---------- Big centre message (countdowns, "GO!", etc.) ---------- */
    #center-msg {
      top: 38%; left: 0; right: 0; text-align: center;
    }
    /* The dark panel behind big messages, so they read over any scene.
       --cc is the message colour, used for the panel's top edge. */
    #center-msg .box {
      display: inline-block; max-width: calc(100vw - 32px);
      padding: 12px 34px 16px; border-radius: 20px;
      background: rgba(8, 12, 30, 0.82); border: 2px solid var(--line); border-top: 4px solid var(--cc);
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
    }
    #center-msg .main {
      display: block; font-size: 64px; font-weight: 900; letter-spacing: .02em; line-height: 1.1;
      text-shadow: 0 4px 0 rgba(0,0,0,.45);
    }
    #center-msg .sub { display: block; font-size: 22px; font-weight: 600; margin-top: 6px; color: var(--text); }

    /* ---------- Toast: short pop-up notes ("+3 coins") ---------- */
    #toast {
      bottom: 110px; left: 50%; transform: translateX(-50%);
      padding: 10px 20px; border-radius: 999px;
      background: var(--panel); border: 1px solid var(--line);
      font-size: 20px; font-weight: 700; opacity: 0; transition: opacity .25s;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* ---------- Bottom hint bar: which keys to press right now ---------- */
    #hint {
      bottom: 16px; left: 50%; transform: translateX(-50%);
      padding: 8px 16px; border-radius: 10px; background: var(--panel);
      font-size: 15px; color: var(--muted); white-space: nowrap;
    }
    #hint:empty { display: none; }
    kbd {
      display: inline-block; padding: 1px 7px; border-radius: 5px;
      background: #26305a; color: var(--text); font-family: inherit; font-size: 13px;
      border-bottom: 2px solid #0a0f22;
    }

    /* ---------- Yes/No style choice prompt ---------- */
    #choice {
      top: 58%; left: 50%; transform: translateX(-50%);
      width: max-content; max-width: calc(100vw - 32px);
      padding: 16px 20px; border-radius: 16px; background: var(--panel-solid);
      border: 2px solid var(--line); text-align: center; display: none;
    }
    #choice.show { display: block; }
    #choice .title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
    #choice .opts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    #choice .opt {
      padding: 10px 22px; border-radius: 10px; background: #26305a;
      font-size: 18px; font-weight: 700; border: 2px solid transparent;
    }
    #choice .opt.sel { border-color: var(--accent); background: #3a4580; }
    /* Options you can't pick right now: greyed out, with the reason under the label. */
    #choice .opt.off { background: #1a2140; color: #5d6789; border: 2px dashed #2c3560; }
    #choice .opt .why { display: block; font-size: 12px; font-weight: 700; color: var(--bad); margin-top: 2px; }

    /* ---------- Minigame HUD: timer + live scores ---------- */
    #mg-hud {
      top: 12px; left: 50%; transform: translateX(-50%);
      display: none; gap: 10px; align-items: center;
    }
    #mg-hud.show { display: flex; }
    #mg-hud .timer {
      padding: 6px 16px; border-radius: 10px; background: var(--panel);
      font-size: 26px; font-weight: 900; min-width: 76px; text-align: center;
    }
    #mg-hud .score {
      padding: 6px 12px; border-radius: 10px; background: var(--panel);
      font-size: 18px; font-weight: 700; border-bottom: 4px solid; white-space: nowrap;
    }
    #mg-hud .score.out { opacity: .35; text-decoration: line-through; }

    /* ---------- Full-screen cards: menu, minigame intro, results ---------- */
    #overlay {
      inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(5, 8, 20, 0.6); pointer-events: auto;
    }
    #overlay.show { display: flex; }
    .card {
      width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto;
      padding: 26px 28px; border-radius: 20px;
      background: var(--panel-solid); border: 2px solid var(--line);
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .card h1 { margin: 0 0 4px; font-size: 44px; letter-spacing: .02em; }
    .card h1 .t1 { color: var(--accent); }
    .card h2 { margin: 0 0 8px; font-size: 30px; }
    .card p { color: var(--muted); margin: 6px 0 14px; line-height: 1.45; }
    .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
    .slot {
      padding: 10px 12px; border-radius: 12px; background: #1a2448;
      border-left: 6px solid; display: flex; flex-direction: column; gap: 6px;
    }
    .slot label { font-size: 12px; color: var(--muted); }
    .slot input, .slot select, .row select {
      font: inherit; font-size: 15px; padding: 6px 8px; border-radius: 8px;
      border: 1px solid var(--line); background: #0f1631; color: var(--text);
    }
    .row { display: flex; gap: 10px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
    .btn {
      font: inherit; font-size: 20px; font-weight: 800; cursor: pointer;
      padding: 12px 26px; border-radius: 12px; border: none;
      background: var(--accent); color: #1a1300;
    }
    .btn:hover { filter: brightness(1.08); }
    .controls-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
    .controls-table td { padding: 4px 6px; border-top: 1px solid var(--line); color: var(--muted); }
    .controls-table td:first-child { color: var(--text); font-weight: 600; white-space: nowrap; }
    .result-row {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin: 6px 0;
      border-radius: 12px; background: #1a2448; border-left: 6px solid; font-size: 18px;
    }
    .result-row .place { font-weight: 900; width: 44px; font-size: 22px; }
    .result-row .who { flex: 1; font-weight: 700; }
    .result-row .gain { color: var(--good); font-weight: 800; }
    .muted { color: var(--muted); }

    @media (max-width: 640px) {
      .slots { grid-template-columns: 1fr; }
      #center-msg .main { font-size: 44px; }
      .pcard { min-width: 120px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD layers. pointer-events are off so they never block the game. -->
  <div id="hud-players" class="layer"></div>
  <div id="turn-label" class="layer"></div>
  <div id="mg-hud" class="layer"></div>
  <div id="center-msg" class="layer"></div>
  <div id="choice" class="layer"></div>
  <div id="toast" class="layer"></div>
  <div id="hint" class="layer"></div>
  <div id="overlay" class="layer"><div class="card" id="card"></div></div>

  <!-- Three.js is vendored locally so the game works offline and from file:// -->
  <script src="../shared/vendor/three.min.js"></script>

  <!-- Game code. Plain scripts (not ES modules) so double-clicking
       index.html works without a web server. Order matters: each file
       can use anything defined by the files above it. -->
  <script src="../shared/js/util.js"></script>
  <script src="../shared/js/sfx.js"></script>
  <script src="../shared/js/input.js"></script>
  <script src="../shared/js/rumble.js"></script>
  <script src="../shared/js/menunav.js"></script>
  <script src="js/ui.js"></script>
  <script src="../shared/js/car.js"></script>
  <script src="../shared/js/fx.js"></script>
  <script src="js/arena.js"></script>
  <script src="js/minigames/coin-rush.js"></script>
  <script src="js/minigames/sumo-ring.js"></script>
  <script src="js/minigames/goal-frenzy.js"></script>
  <script src="js/minigames/bomb-tag.js"></script>
  <script src="js/minigames/king-of-the-hill.js"></script>
  <script src="js/minigames/ring-race.js"></script>
  <script src="js/board.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
