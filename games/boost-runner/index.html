<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Boost Runner · Rocket Rumble</title>
  <style>
    /* ------------------------------------------------------------------
       Colour tokens: the hub's set, plus Boost Runner's own green (its
       hub card colour) and the danger-edge red-orange.
       ------------------------------------------------------------------ */
    :root {
      --bg: #070b1a;
      --panel: rgba(12, 17, 38, 0.86);
      --panel-2: #18204a;
      --line: rgba(255, 255, 255, 0.14);
      --text: #f2f5ff;
      --muted: #9aa6c8;
      --accent: #ffcc33;
      --hot: #ff5a3c;
      --mode: #34d399;
      --good: #34d399;
      --edge: #35f3ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    /* The WebGL canvas fills the window; the picture is drawn into a
       letterboxed area of it (see camera.js). All UI floats above. */
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .layer { position: fixed; pointer-events: none; }

    /* ---------- Player panels along the top ---------- */
    #hud-players {
      top: 10px; left: 10px; right: 10px;
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    }
    .pcard {
      position: relative; min-width: 160px; padding: 7px 12px 9px; border-radius: 12px;
      background: var(--panel); border: 2px solid var(--line); border-left: 6px solid var(--pc);
      transition: opacity .25s, filter .25s;
    }
    .pcard .top { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
    .pcard .name { font-weight: 800; font-size: 16px; color: var(--pc); }
    .pcard .ctrl { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .pcard .boost { height: 6px; margin-top: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
    .pcard .boost i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--pc), #fff3c0); }
    .pcard .ko {
      position: absolute; right: 12px; bottom: 2px; transform: rotate(-8deg);
      font-size: 22px; font-weight: 900; color: var(--hot); letter-spacing: .04em;
      text-shadow: 0 2px 0 rgba(0,0,0,.5); display: none;
    }
    .pcard.out { filter: grayscale(1); opacity: .55; }
    .pcard.out .ko { display: block; filter: none; }
    .pips { display: inline-flex; gap: 4px; }
    .pip { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--pc, var(--accent)); }
    .pip.on { background: var(--pc, var(--accent)); box-shadow: 0 0 8px var(--pc, var(--accent)); }

    #round-label {
      top: 84px; left: 50%; transform: translateX(-50%);
      font-size: 13px; font-weight: 800; letter-spacing: .18em; color: var(--muted);
      padding: 3px 12px; border-radius: 999px; background: var(--panel);
    }
    #round-label:empty { display: none; }

    /* ---------- Stage: sits exactly on the 3D picture ---------- */
    #stage { overflow: hidden; }
    /* Danger edge: red-orange glow on the trailing 10% of the picture. */
    #danger {
      position: absolute; left: 0; top: 0; bottom: 0; width: 10%;
      background: linear-gradient(90deg, rgba(255, 70, 40, .55), rgba(255, 90, 60, .12) 70%, rgba(255, 90, 60, 0));
      border-left: 3px solid rgba(255, 90, 60, .8);
      opacity: .45; transition: opacity .2s;
    }
    #danger.hot { opacity: 1; animation: dangerPulse .5s ease-in-out infinite alternate; }
    @keyframes dangerPulse { from { filter: brightness(1); } to { filter: brightness(1.6); } }
    #marks > div { position: absolute; left: 0; top: 0; will-change: transform; }
    .tag {
      margin: -22px 0 0 -16px; width: 32px; text-align: center;
      font-size: 12px; font-weight: 900; color: #0b0f1f; background: var(--pc);
      border-radius: 6px; padding: 1px 0; box-shadow: 0 2px 0 rgba(0,0,0,.4);
    }
    .ring {
      margin: -30px 0 0 -30px; width: 60px; height: 60px; border-radius: 50%;
      border: 4px solid var(--hot); box-shadow: 0 0 16px var(--hot), inset 0 0 10px var(--hot);
      animation: ringPulse .35s ease-in-out infinite alternate;
    }
    @keyframes ringPulse { from { opacity: .45; } to { opacity: 1; } }
    .arrow { margin: -18px 0 0 -18px; width: 36px; height: 36px; display: grid; place-items: center; }
    .arrow b {
      position: absolute; width: 0; height: 0;
      border-left: 14px solid transparent; border-right: 14px solid transparent;
      border-bottom: 20px solid var(--pc); filter: drop-shadow(0 0 6px var(--pc));
    }
    .arrow span { position: relative; top: 12px; font-size: 11px; font-weight: 900; color: var(--pc); text-shadow: 0 1px 2px #000; }
    .arrow[data-dir="down"] b { transform: rotate(180deg); }
    .arrow[data-dir="down"] span { top: -14px; }
    .arrow[data-dir="left"] b { transform: rotate(-90deg); }
    .arrow[data-dir="left"] span { top: 0; left: 18px; }
    .arrow[data-dir="right"] b { transform: rotate(90deg); }
    .arrow[data-dir="right"] span { top: 0; left: -18px; }

    /* ---------- Big centre message (3-2-1-GO) ---------- */
    #center-msg {
      top: 34%; left: 0; right: 0; text-align: center;
      text-shadow: 0 5px 0 rgba(0,0,0,.45), 0 0 34px rgba(0,0,0,.6);
    }
    #center-msg .big { display: block; font-size: 96px; font-weight: 900; font-style: italic; line-height: 1; }
    #center-msg .sub { display: block; font-size: 22px; font-weight: 700; margin-top: 8px; }
    #center-msg.pop .big { animation: pop .35s cubic-bezier(.2, 1.6, .4, 1); }
    @keyframes pop { from { transform: scale(1.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    #toast {
      bottom: 64px; left: 50%; transform: translateX(-50%);
      padding: 8px 18px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
      font-size: 18px; font-weight: 700; opacity: 0; transition: opacity .25s; white-space: nowrap;
    }
    #toast.show { opacity: 1; }
    #hint {
      bottom: 14px; left: 50%; transform: translateX(-50%);
      padding: 6px 14px; border-radius: 10px; background: var(--panel);
      font-size: 14px; color: var(--muted); white-space: nowrap;
    }
    #hint:empty { display: none; }
    kbd {
      display: inline-block; padding: 0 6px; border-radius: 5px; background: #26305a;
      color: var(--text); font-family: inherit; font-size: 12px; border-bottom: 2px solid #0a0f22;
    }

    /* ---------- Cards: menu, round win, match end ---------- */
    #overlay {
      inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(5, 8, 20, 0.45); pointer-events: auto;
    }
    #overlay.show { display: flex; }
    #overlay.clear { background: transparent; pointer-events: none; }
    .card {
      width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto;
      padding: 24px 26px; border-radius: 18px;
      background: var(--panel); border: 1px solid var(--line); border-top: 5px solid var(--mode);
      box-shadow: 0 20px 60px rgba(0,0,0,.5); backdrop-filter: blur(6px);
    }
    .card.round { width: min(460px, calc(100vw - 32px)); pointer-events: none; }
    .card h1 { margin: 0; font-size: clamp(40px, 7vw, 64px); font-style: italic; font-weight: 900; line-height: 1;
      text-shadow: 0 5px 0 rgba(0,0,0,.4); }
    .card h1 .a { color: var(--mode); }
    .card h2 { margin: 2px 0 10px; font-size: 28px; font-style: italic; font-weight: 900; }
    .card p { color: var(--muted); margin: 8px 0 14px; line-height: 1.45; }
    .eyebrow { font-size: 12px; letter-spacing: .16em; color: var(--muted); font-weight: 800; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .slot {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center;
      padding: 10px; border-radius: 12px; background: var(--panel-2); border-left: 6px solid;
    }
    .slot label { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
    .slot input, .slot select, .row select {
      width: 100%; font: inherit; font-size: 15px; padding: 7px 8px; border-radius: 8px;
      border: 1px solid var(--line); background: #0d1330; color: var(--text);
    }
    .row select { width: auto; }
    .row { display: flex; gap: 10px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
    .btn {
      font: inherit; font-size: 19px; font-weight: 800; cursor: pointer; margin-left: auto;
      padding: 11px 26px; border-radius: 12px; border: none; background: var(--mode); color: #04200f;
    }
    .btn.ghost { margin-left: 0; background: #26305a; color: var(--text); }
    .row .btn.ghost + .btn { margin-left: 0; }
    .btn:hover { filter: brightness(1.08); }
    .link { color: var(--muted); text-decoration: none; font-weight: 700; padding: 6px 4px; }
    .link:hover { color: var(--text); }
    .keys { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    .keys td { padding: 5px 4px; border-top: 1px solid var(--line); color: var(--muted); vertical-align: top; }
    .keys td:first-child { color: var(--text); font-weight: 600; white-space: nowrap; }
    .wtable { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
    .wrow {
      display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 10px;
      background: var(--panel-2); border-left: 6px solid var(--pc); font-size: 17px;
    }
    .wrow .who { flex: 1; font-weight: 800; color: var(--pc); }
    .wrow .place { font-weight: 900; width: 22px; }
    .wrow .num { font-weight: 900; width: 20px; text-align: right; }
    .koorder { margin: 6px 0 0; padding-left: 20px; color: var(--text); font-size: 14px; }
    .koorder li { margin: 3px 0; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }

    @media (max-width: 640px) {
      .slots { grid-template-columns: 1fr; }
      #center-msg .big { font-size: 64px; }
      .pcard { min-width: 0; flex: 1 1 40%; }
      #round-label { top: auto; bottom: 10px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- The stage is laid exactly over the 3D picture (the letterbox area),
       so markers and the danger edge line up with the world. -->
  <div id="stage" class="layer">
    <div id="danger"></div>
    <div id="marks"></div>
  </div>
  <div id="hud-players" class="layer"></div>
  <div id="round-label" class="layer"></div>
  <div id="center-msg" class="layer"></div>
  <div id="toast" class="layer"></div>
  <div id="hint" class="layer"></div>
  <div id="overlay" class="layer"><div class="card" id="card"></div></div>

  <!-- Shared engine. Plain scripts (not ES modules) so double-clicking
       index.html works without a web server. Order matters. -->
  <script src="../shared/vendor/three.min.js"></script>
  <script src="../shared/js/util.js"></script>
  <script src="../shared/js/sfx.js"></script>
  <script src="../shared/js/input.js"></script>
  <script src="../shared/js/rumble.js"></script>
  <script src="../shared/js/menunav.js"></script>
  <script src="../shared/js/car.js"></script>
  <script src="../shared/js/fx.js"></script>

  <!-- Game logic (Gameplay), in the order js/README.md gives. -->
  <script src="js/course.js"></script>
  <script src="js/runner-car.js"></script>
  <script src="js/view.js"></script>
  <script src="js/bots.js"></script>
  <script src="js/round.js"></script>
  <script src="js/br.js"></script>

  <!-- Look, sound and screens (Art and UI). -->
  <script src="js/music.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/fx-br.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
