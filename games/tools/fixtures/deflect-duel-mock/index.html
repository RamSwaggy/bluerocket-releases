<!doctype html>
<!-- =====================================================================
     QC TEST FIXTURE, not the game.
     A tiny stand-in for Deflect Duel that implements the agreed test
     interface (TP.duel / TP.DUEL_CFG) with simple rules, so QC's tools
     (deflect-duel-smoke.js, deflect-duel-rules.js) can be tested before
     the real game exists, and re-checked against a known-good target
     whenever the tools change.

     Point a tool at it with:
       DEFLECT_DUEL_INDEX=tools/fixtures/deflect-duel-mock/index.html node tools/deflect-duel-rules.js
     Add ?bug=<name> behaviour by setting MOCK_BUG (see mock.js) to prove a
     test really catches that bug.
     ===================================================================== -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Deflect Duel (QC mock)</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font: 14px sans-serif; }
    #overlay { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; }
    #overlay.show { display: flex; }
    #card { background: #223; padding: 20px; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="overlay"><div id="card"></div></div>
  <script src="../../../shared/vendor/three.min.js"></script>
  <script src="../../../shared/js/util.js"></script>
  <script src="../../../shared/js/input.js"></script>
  <script src="../../../shared/js/car.js"></script>
  <script src="../../../shared/js/rumble.js"></script>
  <script src="mock.js"></script>
</body>
</html>
